   rows: 3
   cols: 3
   dt: d
   data: [-0.999916085771, 0.0110292823222, -0.00679531155927, 0.0106849959445, 0.405573504932, -0.913999979748, -0.00732476552347, -0.913995890044, -0.405657319365]
R_vehicle_camera_definition: "p_vehicle = R_vehicle_camera * p_camera_optical + t_vehicle_camera_m"
t_vehicle_camera_m: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [1.660756071, -0.583885067, 0.998967616247]
calibration_rms: 0.496524430504
bev_remap_x: "fisheye_right_bev_map_x.npy"
