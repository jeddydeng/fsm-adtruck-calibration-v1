vehicle_frame: sensor_kit_base_link
image_width: 1600
image_height: 1200
distortion_model: equidistant
bev_width: 512
bev_height: 512
meters_per_pixel: 0.015
bev_origin_u_px: 256
bev_origin_v_px: 256
bev_axes: "u_right_is_vehicle_minus_y; v_down_is_vehicle_minus_x"
extrinsic_source: "camera_relative_to_roof_lidar.yaml + quality-gated Part3 ground refinement"
K: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [478.879108647, 0, 809.640650677, 0, 479.552776592, 533.364177761, 0, 0, 1]
D: !!opencv-matrix
   rows: 4
   cols: 1
   dt: d
   data: [0.0330818225403, -0.0100050432464, -0.00411660761335, 0.000587969581179]
K_rectified: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [167.084302299, 0, 780.737568648, 0, 167.319349802, 626.28881515, 0, 0, 1]
H_bev: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [-0.00284296418527, -0.475330316847, 240.724976625, -0.132773924019, -0.258787391232, 246.264121332, -1.4374658297e-05, -0.00179117297086, 1]
