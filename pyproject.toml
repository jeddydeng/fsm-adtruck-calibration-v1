[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["ros_ws/src/rslidar_sdk/src/rs_driver", "ros_ws/src/serial"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests", "process/fisheye_bev/test_fisheye_bev.py", "process/joint_extrinsic_station/test_station.py", "drivers/pi_capture/tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["process/joint_extrinsic_station", "process/fisheye_bev", "scripts"]
