name: Software checks
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: ./install.sh --python-only
  jazzy-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ./install.sh --full
      - run: ./scripts/smoke_station.sh
