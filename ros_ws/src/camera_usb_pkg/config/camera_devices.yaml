# Confirmed on the vehicle on 2026-08-21. These six observation cameras are
# captured directly by Sensor_capture/calibration tools and are intentionally
# not published to ROS or used by Autoware traffic-light recognition. The first
# five Alcor cameras do not expose unique USB serial numbers, so their physical
# ports are part of their identity. The front-mid camera has a unique by-id path.
cameras:
  - index: 0
    role: rear_left
    ros_namespace: video_rear_left
    physical_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:1:1.0-video-index0
    identity_globs: []
    expected_usb_id: "1689:2304"
    frame_id: video_rear_left/camera_optical_link
    camera_name: video_rear_left

  - index: 1
    role: front_left
    ros_namespace: video_front_left
    physical_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:2:1.0-video-index0
    identity_globs: []
    expected_usb_id: "1689:2304"
    frame_id: video_front_left/camera_optical_link
    camera_name: video_front_left

  - index: 2
    role: front_right
    ros_namespace: video_front_right
    physical_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:3:1.0-video-index0
    identity_globs: []
    expected_usb_id: "1689:2304"
    frame_id: video_front_right/camera_optical_link
    camera_name: video_front_right

  - index: 3
    role: rear_right
    ros_namespace: video_rear_right
    physical_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:4:1.0-video-index0
    identity_globs: []
    expected_usb_id: "1689:2304"
    frame_id: video_rear_right/camera_optical_link
    camera_name: video_rear_right

  - index: 4
    role: rear_mid
    ros_namespace: video_rear_mid
    physical_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:7:1.0-video-index0
    identity_globs: []
    expected_usb_id: "1689:2304"
    frame_id: video_rear_mid/camera_optical_link
    camera_name: video_rear_mid

  - index: 5
    role: front_mid
    ros_namespace: video_front_mid
    physical_device: /dev/v4l/by-path/pci-0000:00:14.0-usb-0:8:1.0-video-index0
    # Only one of the two alternative front cameras is connected at a time.
    # Add the second camera's by-id glob here after its first inventory scan.
    identity_globs:
      - /dev/v4l/by-id/usb-LuoKe_Technology_Co.__Ltd._LRCP_G720P*-video-index0
    expected_usb_id: "0c45:1915"
    frame_id: video_front_mid/camera_optical_link
    camera_name: video_front_mid
