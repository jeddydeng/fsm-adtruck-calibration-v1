common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
- driver:
    lidar_type: RSHELIOS
    msop_port: 6701
    difop_port: 7790
    start_angle: 185
    end_angle: 70
    wait_for_difop: false
    min_distance: 0.2
    max_distance: 200
    use_lidar_clock: false
    pcap_path: /home/robosense/lidar.pcap
    split_frame_mode: 1
    split_angle: 180
    dense_points: true
  ros:
    ros_frame_id: velodyne_left_base_link
    ros_recv_packet_topic: /rslidar_packets
    ros_send_packet_topic: /rslidar_packets
    ros_send_point_cloud_topic: /sensing/lidar/left/pointcloud_raw_all
- driver:
    lidar_type: RSHELIOS
    msop_port: 6702
    difop_port: 7791
    start_angle: 290
    end_angle: 175
    wait_for_difop: false
    min_distance: 0.2
    max_distance: 200
    use_lidar_clock: false
    pcap_path: /home/robosense/lidar.pcap
    split_frame_mode: 1
    split_angle: 180
    dense_points: true
  ros:
    ros_frame_id: velodyne_right_base_link
    ros_recv_packet_topic: /rslidar_packets
    ros_send_packet_topic: /rslidar_packets
    ros_send_point_cloud_topic: /sensing/lidar/right/pointcloud_raw_all
